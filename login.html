<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - CHITA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --c-dark: #392a28;
      --c-primary: #246a73;
      --c-light: #f3dfc1;
      --c-border: #ddbea8;
      --bg-main: #faf9f6;
      --text-muted: #6b5b59;
      --radius-md: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-main);
      color: var(--c-dark);
      -webkit-font-smoothing: antialiased;
    }

    /* THE DESKTOP SPLIT LAYOUT (SIDE-BY-SIDE) */
    .login-split {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      min-height: 100vh;
      animation: fadeIn 0.3s ease;
    }

    .login-visual {
      background: var(--c-dark);
      padding: 80px;
      color: var(--c-light);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-form-area {
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .login-box {
      width: 100%;
      max-width: 360px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1.5px solid var(--c-border);
      border-radius: var(--radius-md);
      margin-bottom: 12px;
      outline: none;
      transition: 0.2s;
      font-family: inherit;
    }

    input:focus {
      border-color: var(--c-primary);
    }

    .btn {
      padding: 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .btn-p {
      background: var(--c-primary);
      color: white;
    }

    .btn-p:hover {
      background: #368f8b;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* THE HORIZONTAL RESPONSIVE COOKING LAYER */
    @media (max-width: 768px) {
      .login-split {
        grid-template-columns: 1fr; /* Switch from 2 columns to a single column block */
        grid-template-rows: auto 1fr; /* Top gets auto height, form area gets remaining space */
      }

      .login-visual {
        padding: 40px 24px; /* Tighten up spacing since it's a top banner now */
        text-align: center;
        justify-content: center;
        align-items: center;
      }

      .login-visual h2 {
        font-size: 24px !important; /* Scale down heading slightly on small screens */
        margin-bottom: 8px !important;
      }

      .login-visual p {
        font-size: 14px !important;
      }

      .login-form-area {
        padding: 40px 24px;
        align-items: flex-start; /* Keeps the login box near the top on scrollable mobile screens */
      }

      .login-box {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="login-split">
    <div class="login-visual">
      <h2 style="font-size:36px; margin-bottom:20px; letter-spacing:-1px">CHITA Procurement and Supply Chain Portal</h2>
      <p style="font-size:18px; opacity:0.8; line-height:1.6"><i>Authorized Personnel Only</i></p>
    </div>
    
    <div class="login-form-area">
      <div class="login-box" style="display: flex; flex-direction: column; align-items: flex-start;">
        <img src="assets/Child-Help-Logo.png" alt="Logo" style="height: 54px; margin-bottom: 32px; width: auto;">
        <h3 style="font-size:24px; margin-bottom:32px; color:var(--c-dark)">Sign In</h3>

        <input type="email" placeholder="Email Address" value="admin@mbuyunihosp.co.tz">
        <input type="password" placeholder="Password" value="••••••••">

        <a href="admin.html" class="btn btn-p" style="width:100%; margin-bottom: 20px;">Enter Platform</a>

        <div style="width: 100%; text-align: center; font-size: 13px; color: var(--text-muted);">
          Don't have an account?
          <a href="register.html" style="color: var(--c-primary); font-weight: 700; text-decoration: underline; text-underline-offset: 4px;">
            Register here
          </a>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
